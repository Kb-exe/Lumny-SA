# Modern workflow for building and deploying Vite / React application to GitHub Pages
name: Deploy Lumina SA to GitHub Pages

on:
  # Runs on pushes targeting the main/master branch
  push:
    branches: ["main", "master"]

  # Allows manual workflow trigger from GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job compiles TypeScript and Vite bundle into ./dist
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build production app
        run: |
          npm run build
          # Guarantee .nojekyll exists to bypass Jekyll static generator
          touch dist/.nojekyll
          # Copy index.html to 404.html for SPA client-side route fallback
          cp dist/index.html dist/404.html

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
